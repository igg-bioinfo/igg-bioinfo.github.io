<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% seo %}
</head>
<body>

  <nav id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="{{ '/' | relative_url }}">IGG<span>Bioinfo</span></a>
      <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleMenu()">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="{{ '/#research' | relative_url }}">Research</a></li>
        <li><a href="{{ '/#team' | relative_url }}">Team</a></li>
        <li><a href="{{ '/#projects' | relative_url }}">Projects</a></li>
        <li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
        <li><a href="{{ '/#contact' | relative_url }}">Contact</a></li>
        <li><a class="nav-github" href="{{ site.github }}" target="_blank" rel="noopener">GitHub ↗</a></li>
      </ul>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© {{ 'now' | date: "%Y" }} {{ site.title }} — {{ site.institution }}</span>
      <a href="{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
